org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin compiler runs as its own daemon; without an explicit Xmx it
# falls back to the JVM default (around 256m), which is too small for
# Compose-heavy screens like MembersScreen once Firebase is on the
# classpath. The Compose compiler plugin threads state through nested
# lambdas during type inference, which makes peak compile-time memory
# scale unkindly with composable depth. 2g still OOM'd on GHA; bumping
# to 4g. GHA ubuntu-latest has 7g RAM total so 4g Gradle + 4g Kotlin
# is tight but workable for serial builds.
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
