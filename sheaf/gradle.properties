org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin compiler runs as its own daemon; without an explicit Xmx it
# falls back to the JVM default (around 256m), which is too small for
# Compose-heavy screens like MembersScreen once Firebase is on the
# classpath. The Compose compiler plugin threads state through nested
# lambdas during type inference, which makes peak compile-time memory
# scale unkindly with composable depth. As those screens grew (member
# profile + edit + banner cropper) 4g began OOMing the open-release
# compile on CI ("Not enough memory to run compilation"); 6g clears it.
# GHA ubuntu-latest (public repo) has 16g RAM, so 4g Gradle + 6g Kotlin
# leaves comfortable headroom.
kotlin.daemon.jvmargs=-Xmx6144m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
